stages:
  - build

variables:
  REGISTRY_ENDPOINT: "cr.yandex"
  UPSTREAM_DB_IMAGE: "postgres:17"
  TARGET_DB_NAME: "db"
  TARGET_API_NAME: "ts-api"

# Copies the upstream postgres image into the Yandex Cloud registry
copy-db-to-yandex:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login --username json_key --password-stdin cr.yandex < "$SA_KEY_FILE"
    - docker pull $UPSTREAM_DB_IMAGE
    - docker tag $UPSTREAM_DB_IMAGE $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_DB_NAME:latest
    - docker push $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_DB_NAME:latest

# Builds and pushes the FastAPI image to the Yandex Cloud registry
build-api:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login --username json_key --password-stdin cr.yandex < "$SA_KEY_FILE"
    - docker build -t $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_API_NAME:$CI_COMMIT_SHA -f Dockerfile .
    - docker push $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_API_NAME:$CI_COMMIT_SHA
    - docker tag $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_API_NAME:$CI_COMMIT_SHA $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_API_NAME:latest
    - docker push $REGISTRY_ENDPOINT/$REGISTRY_ID/$TARGET_API_NAME:latest