stages:
  - build
  - deploy

variables:
  REGISTRY_ENDPOINT: "cr.yandex"
  REGISTRY_ID: "crp76t66v12au4b36gbk"
  API_IMAGE: "$REGISTRY_ENDPOINT/$REGISTRY_ID/ts-api"
  UI_IMAGE: "$REGISTRY_ENDPOINT/$REGISTRY_ID/ts-ui"
  # Unused — kept for reference: postgres image is NOT copied on every build anymore.
  # DB data lives in the cloud DB and is migrated once via scripts/migrate_db.py.

# Build job template: kaniko builds without a Docker daemon,
# so no dind/privileged/network headaches in the k8s runner.
.kaniko-build: &kaniko-build
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
before_script:
    # Yandex Container Registry auth: username=json_key, password=authorized key.
    # YC_SA_KEY is a GitLab "File" variable, so $YC_SA_KEY is a path
    # to the authorized-key JSON inside the job container.
    # Build a docker-style config.json so kaniko can push to cr.yandex.
    - mkdir -p /kaniko/.docker
    - AUTH=$(echo -n "json_key:$(cat "$YC_SA_KEY")" | base64 -w0 | tr -d '\n')
    - echo "{\"auths\":{\"$REGISTRY_ENDPOINT\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json

build-api:
  <<: *kaniko-build
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.api"
      --destination "${API_IMAGE}:${CI_COMMIT_SHA}"
      --destination "${API_IMAGE}:latest"
      --cache=true

build-ui:
  <<: *kaniko-build
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.ui"
      --destination "${UI_IMAGE}:${CI_COMMIT_SHA}"
      --destination "${UI_IMAGE}:latest"
      --cache=true

# Deploys the built images into the k8s cluster (only on main).
# Auth: builds a kubeconfig from CI variables (token of the `ci-deployer`
# ServiceAccount defined in k8s/ci-deployer.yaml).
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:1.30
    entrypoint: [""]
  only:
    - main
  variables:
    NAMESPACE: rossmann
  before_script:
    - mkdir -p "$HOME/.kube"
    - |
      cat > "$HOME/.kube/config" <<EOF
      apiVersion: v1
      kind: Config
      clusters:
        - cluster:
            server: "${K8S_APISERVER}"
            certificate-authority-data: "${K8S_CA_CERT}"
          name: cluster
      contexts:
        - context:
            cluster: cluster
            user: ci-deployer
            namespace: ${NAMESPACE}
          name: deploy
      current-context: deploy
      users:
        - name: ci-deployer
          user:
            token: "${K8S_SA_TOKEN}"
      EOF
  script:
    - kubectl version --client 2>/dev/null || true
    - kubectl get ns ${NAMESPACE} || kubectl create ns ${NAMESPACE}
    - kubectl apply -f k8s/ -n ${NAMESPACE}
    - kubectl create secret docker-registry cr-yandex
        --docker-server=cr.yandex
        --docker-username=json_key
        --docker-password="$(cat "$YC_SA_KEY")"
        -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
    - kubectl set image deployment/ts-api ts-api=${API_IMAGE}:${CI_COMMIT_SHA} -n ${NAMESPACE} --record
    - kubectl set image deployment/ts-ui ts-ui=${UI_IMAGE}:${CI_COMMIT_SHA} -n ${NAMESPACE} --record
    - kubectl rollout status deployment/ts-api -n ${NAMESPACE} --timeout=120s
    - kubectl rollout status deployment/ts-ui -n ${NAMESPACE} --timeout=120s
