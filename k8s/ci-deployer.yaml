# CI deployer: grants the GitLab runner ServiceAccount
# enough rights to apply manifests inside the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: rossmann
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: rossmann
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "apply"]
  - apiGroups: [""]
    resources: ["services", "pods", "secrets", "serviceaccounts", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: rossmann
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: rossmann
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io