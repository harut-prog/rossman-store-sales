<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rossmann Sales Forecast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card upload-card shadow-sm">
            <div class="card-body">
                <h1 class="card-title h4 text-center mb-3">Rossmann Sales Forecast</h1>
                <form action="/predict" method="post" enctype="multipart/form-data">
                    <div class="upload-area mb-3">
                        <label for="data">
                            <p class="mb-1">Перетащите Excel файл или нажмите для выбора</p>
                            <p class="text-muted small mb-0">Формат: .xlsx</p>
                        </label>
                        <input type="file" name="data" id="data" accept=".xlsx,.xls" class="form-control">
                    </div>
                    <div id="fileInfo" class="text-muted small mb-3" style="display:none;"></div>
                    <button type="submit" class="btn btn-primary w-100">Получить прогноз</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('data').addEventListener('change', function() {
            var info = document.getElementById('fileInfo');
            if (this.files.length) {
                info.textContent = 'Выбран: ' + this.files[0].name;
                info.style.display = 'block';
            } else {
                info.style.display = 'none';
            }
        });
    </script>
</body>
</html>
